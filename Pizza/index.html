<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your Pizza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    




<div class="grid">

<header>
    <h1>Build Your Pizza</h1>
</header>

<nav>
    <img src="cheese.png" alt="Cheese" draggable="true" class="ingredient">
    <img src="pepperoni.png" alt="Pepperoni" draggable="true" class="ingredient">
</nav>
<main>
    <div class="pizza" id="pizza"></div>
</main>
<aside>
    <img src="mushroom.png" alt="Mushroom" draggable="true" class="ingredient">
    <img src="tomato.png" alt="Tomato" draggable="true" class="ingredient">
</aside>
<footer>
    <button id="resetBtn">Reset</button>
    <button id="undoBtn">Return</button>
</footer>
</div>

<script src="script.js"></script>
</body>
</html>
